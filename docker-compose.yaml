version: "3.8"

services:
  backend:
    build: ./backend
    container_name: boum-backend
    networks:
      - boum-network
    environment:
      - DATABASE_URL=sqlite+pysqlite:///${DATABASE_DEST_URL}
      - UPLOAD_FOLDER=${VIDEO_INPUT_DIR:-/data/input}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GPUSTACK_API_TOKEN=${GPUSTACK_API_TOKEN}
      - SPEECH_UPSTREAM_URL=${SPEECH_UPSTREAM_URL}
      - COMPLETIONS_UPSTREAM_URL=${COMPLETIONS_UPSTREAM_URL}
    volumes:
      - ${DATABASE_LOCAL_DIR}:${DATABASE_DEST_DIR}:rw
      - ${VIDEO_DIR_PATH}:${VIDEO_INPUT_DIR}:rw

  video_processor:
    build: ./video_processing_worker
    container_name: boum-video-processor
    networks:
      - boum-network
    environment:
      - VIDEO_INPUT_DIR=${VIDEO_INPUT_DIR:-/data/input}
      - DATABASE_URL=sqlite+pysqlite:///${DATABASE_DEST_URL}

      - SLURM_HOST=${SLURM_HOST}
      - SLURM_USER=${SLURM_USER}
      - SLURM_GRES=${SLURM_GRES}
      - SLURM_MEMORY=${SLURM_MEMORY}
      - SLURM_CPUS_PER_TASK=${SLURM_CPUS_PER_TASK}
      - SLURM_BATCH_FILE=${SLURM_BATCH_FILE}

      - SSH_KEY_PATH=${SSH_KEY_PATH}
      - KNOWN_HOSTS_FILE=${KNOWN_HOSTS_FILE}

      - NUM_VIDEO_PROCESSING_WORKERS=${NUM_WORKERS}
    volumes:
      - ${VIDEO_DIR_PATH}:${VIDEO_INPUT_DIR}:rw
      - ${DATABASE_LOCAL_DIR}:${DATABASE_DEST_DIR}:rw
      - ${SSH_KEY_LOCAL_FILE}:${SSH_KEY_PATH}:ro
      - ${KNOWN_HOSTS_LOCAL_FILE}:${KNOWN_HOSTS_FILE}:ro

  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api}
    container_name: boum-frontend
    networks:
      - boum-network
    depends_on:
      - backend
    environment:
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api}

  nginx:
    image: docker.io/nginx:alpine
    container_name: boum-nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - boum-network
    depends_on:
      - backend

networks:
  boum-network:
    driver: bridge
