version: "3.8"

services:
  backend:
    build: ./backend
    container_name: boum-backend
    networks:
      - boum-network
    environment:
      - DATABASE_URL=sqlite+pysqlite:///${DATABASE_DEST_URL}
      - UPLOAD_FOLDER=${VIDEO_INPUT_DIR:-/data/input}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ${DATABASE_LOCAL_DIR}:${DATABASE_DEST_DIR}:rw
      - ${VIDEO_DIR_PATH}:${VIDEO_INPUT_DIR}:rw

  video_processor:
    build: ./video_processing_worker
    container_name: boum-video-processor
    networks:
      - boum-network
    environment:
      - VIDEO_INPUT_DIR=${VIDEO_INPUT_DIR:-/data/input}
      - DATABASE_URL=sqlite+pysqlite:///${DATABASE_DEST_URL}
    volumes:
      - ${VIDEO_DIR_PATH}:${VIDEO_INPUT_DIR}:rw
      - ${DATABASE_LOCAL_DIR}:${DATABASE_DEST_DIR}:rw

  frontend:
    build: ./frontend
    container_name: boum-frontend
    networks:
      - boum-network
    depends_on:
      - backend

  nginx:
    image: docker.io/nginx:alpine
    container_name: boum-nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - boum-network
    depends_on:
      - backend

networks:
  boum-network:
    driver: bridge
